name: build-docs-pr

# Builds the documentation on pull requests that touch it, so broken links or
# markup fail the build (mkdocs strict mode), and uploads the generated site
# as an artifact for preview. Download the artifact, unzip it, and run
# `python -m http.server` in its root directory to preview the website.

on:
  pull_request:
    paths:
      - "doc/**"
      - "lib/**"
      - "mkdocs.yml"
      - "mkdocs/**"
      - "build-doc.sh"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/workflows/build-docs-pr.yml"
  workflow_dispatch: # allow manual trigger from Actions page

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install MkDocs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs \
            mkdocs-material \
            mkdocs-awesome-pages-plugin \
            mkdocs-macros-plugin \
            mike

      - name: Build documentation
        run: |
          chmod +x ./build-doc.sh
          ./build-doc.sh

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/
